# zapcloud — monorepo (Cargo workspace) del ecosistema.
# Ver docs/rfc/zapcloud.md (§13 ecosistema) y docs/rfc/lambda-zapcloud.md (§11 estructura).
#
# Regla de dependencias del workspace:
#   shared/*                  no depende de ningún proyecto (kernel transversal)
#   zapcloud-<servicio>/*     depende de shared/*, NO de otros servicios
#   bins/*                    ensamblan un servicio (o varios) en un binario
#
# v0.1 = solo Functions. Añadir un servicio nuevo = una carpeta + una línea aquí.
[workspace]
resolver = "2"
members = [
    # --- kernel compartido (shared) ---
    "shared/zc-aws-protocol",   # SigV4, errores AWS, ARN   (§54, §71, §56)
    "shared/zc-persistence",    # SQLite -> Postgres         (§57)
    "shared/zc-artifact-store", # blobs content-addressed    (§14-15)
    "shared/zc-config",         # tenant_trust, memory_budget, doctor (§64)
    "shared/zc-telemetry",      # OTel + Prometheus + logs   (§59-61)

    # --- proyecto: zapcloud-functions (el "lambda-server", §11) ---
    "zapcloud-functions/api-lambda",         # AWS strict /2015-03-31/* (§12)
    "zapcloud-functions/function-manager",   # CRUD + metadata (§13)
    "zapcloud-functions/invocation",         # sync/async (§43-45)
    "zapcloud-functions/executor-core",      # trait Executor — INESTABLE hasta v0.8 (§37)
    "zapcloud-functions/executor-sandbox",   # único executor obligatorio en v1 (§37)

    # --- binario combinado (el "cloud-server start", §13) ---
    "bins/zapcloud",

    # --- utilidades de build (bundles, reproducibilidad, CI) ---
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/khrox20/zapcloud"

[workspace.dependencies]
# Internos (path). Se referencian con `<crate>.workspace = true` en cada miembro.
zc-aws-protocol = { path = "shared/zc-aws-protocol" }
zc-persistence = { path = "shared/zc-persistence" }
zc-artifact-store = { path = "shared/zc-artifact-store" }
zc-config = { path = "shared/zc-config" }
zc-telemetry = { path = "shared/zc-telemetry" }
zc-executor-core = { path = "zapcloud-functions/executor-core" }
zc-executor-sandbox = { path = "zapcloud-functions/executor-sandbox" }
zc-invocation = { path = "zapcloud-functions/invocation" }
zc-function-manager = { path = "zapcloud-functions/function-manager" }
zc-api-lambda = { path = "zapcloud-functions/api-lambda" }

# Externos. Stack del RFC de Lambda §10 (Rust/Tokio/Axum/Serde).
# Introducidos por el spike de v0.1 (loop Runtime API, §18); el workspace no
# tenía dependencias externas hasta aquí.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs", "signal", "net"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Persistencia (§57, §58). Introducidos por el paso 2 (zc-persistence).
# sqlite por defecto; el feature "migrate" embebe migrations/ (§45, §76).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

# Artifact store (§14, §15): hashing de contenido. No reinventar crypto (§7, §32).
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["util"] }
hmac = "0.12"
http = "1"
percent-encoding = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }

# Desempaquetado de ZIP de funciones (§16). Introducido por el paso 5
# (zc-invocation): monta el artifact real en el task_root del environment.
zip = { version = "2", default-features = false, features = ["deflate"] }
