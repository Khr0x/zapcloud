# Build reproducible + distribución de runtime bundles como OCI artifacts (§17).
#
# - Ensambla los bundles Linux (carril de referencia, RIC real) en contenedor
#   del target vía Docker. Solo x86_64: arm64 está fuera de scope hasta que haya
#   un host Linux ARM objetivo (evita el compile del RIC nativo bajo QEMU).
# - Gate de reproducibilidad: el build DEBE reproducir el `tree_sha256` pinneado.
#   Es DURO solo donde importa —el PR del índice `ci/update-runtime-index`, que
#   verifica que el pin recién generado reproduce—; en otros PRs es un aviso
#   (un cambio de bundle intencional difiere a propósito) y en `main` no bloquea
#   la publicación (el pin se actualiza vía el PR de índice, revisado).
# - En `main`: publica cada bundle en ghcr.io y abre/actualiza un PR con el
#   `runtimes/index.json` regenerado (lockfile §17). El pin del runtime se revisa
#   antes de mergear; main nunca recibe un commit del índice sin review.
name: runtimes

on:
  # Bootstrap / re-publicación manual: Actions → runtimes → Run workflow (main),
  # o `gh workflow run runtimes.yml --ref main`. Útil tras un índice en `{}` o
  # tras descartar la rama `ci/update-runtime-index`.
  workflow_dispatch:
  pull_request:
    paths:
      - "xtask/**"
      - "zapcloud-functions/runtime/**"
      - "runtimes/index.json"
      - ".github/workflows/runtimes.yml"
  push:
    branches: [main]
    paths:
      - "xtask/**"
      - "zapcloud-functions/runtime/**"
      - ".github/workflows/runtimes.yml"

permissions:
  contents: read
  packages: write

# Serializa por ref: dos merges seguidos a main no se pisan en el push a ghcr ni
# en la rama del índice. No cancela en curso (una publicación a medias es peor).
concurrency:
  group: runtimes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [nodejs22.x, python3.13]
        arch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Resolver target/dir/plataforma
        run: |
          case "${{ matrix.arch }}" in
            amd64) BUNDLE_ARCH=x86_64 ;;
            arm64) BUNDLE_ARCH=arm64 ;;
          esac
          case "${{ matrix.runtime }}" in
            nodejs22.x) PREFIX=nodejs22 ;;
            python3.13) PREFIX=python313 ;;
          esac
          echo "TARGET=linux-${BUNDLE_ARCH}" >> "$GITHUB_ENV"
          echo "PLATFORM=linux-${BUNDLE_ARCH}" >> "$GITHUB_ENV"
          echo "BUNDLE_DIR=runtimes/${PREFIX}-linux-${BUNDLE_ARCH}" >> "$GITHUB_ENV"

      - name: Ensamblar bundle (clean-room, RIC real)
        run: cargo run -p xtask -- bundle --runtime "${{ matrix.runtime }}" --target "$TARGET"

      - name: Verificar integridad
        run: cargo run -p xtask -- verify "$BUNDLE_DIR"

      # Gate de reproducibilidad de LO QUE ENSAMBLAMOS (§17). Buildea 2 veces y
      # exige que las partes deterministas (bootstrap, layout, SBOM, intérprete
      # verificado por checksum) reproduzcan byte a byte. Los binarios nativos
      # UPSTREAM (`*.node`/`*.so`, compilados por el RIC de AWS) NO son
      # bit-reproducibles y se EXCLUYEN del gate; su integridad la garantiza el
      # `tree_sha256` publicado (que sí los incluye) + verificación en el daemon.
      - name: Gate de reproducibilidad (partes deterministas)
        run: |
          # Firma = hash por-fichero, excluyendo metadata (manifest) y binarios
          # nativos upstream no-reproducibles.
          sig() {
            find "$1" -type f ! -name manifest.json ! -path '*/__pycache__/*' \
              ! -name '*.node' ! -name '*.so' ! -name '*.so.*' | sort | while read -r f; do
              printf '%s  %s\n' "${f#"$1"/}" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          }
          sig "$BUNDLE_DIR" > /tmp/sig1.txt
          rm -rf "$BUNDLE_DIR"
          cargo run -p xtask -- bundle --runtime "${{ matrix.runtime }}" --target "$TARGET"
          sig "$BUNDLE_DIR" > /tmp/sig2.txt
          if ! diff /tmp/sig1.txt /tmp/sig2.txt; then
            {
              echo "### ❌ Reproducibilidad — ${{ matrix.runtime }} ${{ matrix.arch }}"
              echo "Partes deterministas NO reproducen (arriba el diff). Esto SÍ es un bug."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::partes deterministas del bundle no reproducen"
            exit 1
          fi
          echo "OK: partes deterministas reproducen byte a byte." \
               "Binarios nativos upstream (*.node) no se exigen bit-idénticos (integridad vía digest publicado)."

      # Reintento: la subida del blob a ghcr sufre timeouts de red transitorios
      # (os error 110) en runners de Actions. El push OCI es idempotente por
      # digest (los blobs ya subidos se saltan), así que reintentar es seguro.
      - name: Publicar en ghcr.io + actualizar índice
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZAPCLOUD_OCI_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          for i in 1 2 3; do
            if cargo run -p xtask -- publish --runtime "${{ matrix.runtime }}" --target "$TARGET"; then
              exit 0
            fi
            echo "::warning::publish falló (intento $i/3); reintentando en $((i*15))s…"
            sleep $((i*15))
          done
          echo "::error::publish a ghcr falló tras 3 intentos"
          exit 1

      - name: Subir SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.runtime }}-${{ matrix.arch }}
          path: ${{ env.BUNDLE_DIR }}/sbom.cdx.json

      - name: Subir fragmento de índice
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: index-${{ matrix.runtime }}-${{ matrix.arch }}
          path: runtimes/index.json

  # Agrega los fragmentos de índice de todas las plataformas y abre/actualiza un
  # PR con el `runtimes/index.json` resultante (lockfile de distribución, §17).
  # No pushea a main: el pin del runtime pasa por review, como una bump de dep.
  update-index:
    needs: bundle
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: index-*
          path: fragments
      - name: Merge determinista de fragmentos
        run: |
          # `*` hace deep-merge de objetos: los mapas por-runtime se combinan.
          jq -s 'reduce .[] as $x ({}; . * $x)' fragments/index-*/index.json \
            > runtimes/index.json
          jq . runtimes/index.json

      # App token (no el GITHUB_TOKEN): un PR abierto con el token por defecto NO
      # dispara workflows, así que los checks no correrían sobre el PR del índice.
      # El App necesita permisos Contents:RW + Pull requests:RW e instalarse en el repo.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RUNTIMES_BOT_APP_ID }}
          private-key: ${{ secrets.RUNTIMES_BOT_PRIVATE_KEY }}

      # Idempotente: sin diff no abre PR; con diff, actualiza SIEMPRE la misma
      # rama/PR (`ci/update-runtime-index`), nunca duplica. Ver nota de bucle abajo.
      - name: Abrir/actualizar PR con el índice
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: runtimes/index.json
          branch: ci/update-runtime-index
          base: main
          delete-branch: true
          commit-message: "chore(runtimes): actualizar index.json de distribución OCI (§17)"
          title: "chore(runtimes): actualizar index.json de distribución OCI (§17)"
          body: |
            Índice de distribución regenerado tras publicar los bundles a ghcr.io.
            Pins nuevos: `oci_digest` + `tree_sha256` por runtime×plataforma.

            **Revisar antes de mergear:** que los digests correspondan a los bundles
            recién publicados. Mergear adopta esos bundles como los que instalará
            `zapcloud runtimes install` / el preflight de `serve` (§17).
