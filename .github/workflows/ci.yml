name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.1

jobs:
  workspace:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: fmt
            command: cargo fmt --all -- --check
          - check: check
            command: cargo check --workspace --all-targets --locked
          - check: clippy
            command: cargo clippy --workspace --all-targets --locked -- -D warnings
          - check: test
            command: cargo test --workspace --locked
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Instalar Rust fijado
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        if: matrix.check != 'fmt'
        with:
          key: ${{ matrix.check }}

      - name: Declarar pruebas omitidas
        if: matrix.check == 'test'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Cobertura del workspace
          Se ejecutan tests unitarios, de integración y doctests con Cargo.lock.
          Tres pruebas están marcadas `#[ignore]` y aparecen como **ignored**, no como aprobadas:

          | Prueba | Prerrequisito pendiente en este workflow |
          | --- | --- |
          | `nodejs_invoke_end_to_end` | Bundle Node del host |
          | `python_invoke_end_to_end` | Bundle Python del host |
          | `oci_push_pull_roundtrip_real` | Registry OCI y `ZAPCLOUD_OCI_TEST_REF` |

          Ver `tests/README.md` para ejecutarlas explícitamente con `--ignored`.
          Los E2E Node/Python se ejecutan en `runtimes.yml` para PRs con cambios de código, dependencias o pruebas.
          Este workflow no certifica paridad RIC Linux ni cierra v0.1.2.
          EOF
          echo "::notice::Node/Python E2E y OCI round-trip omitidos explícitamente; ver resumen y tests/README.md."

      - name: Ejecutar ${{ matrix.check }}
        run: ${{ matrix.command }}

  golden:
    name: golden (CLI + SDK JS + SDK Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Instalar Rust fijado
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: golden
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.11.0'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Instalar AWS CLI 2.17.27 y SDK fijados
        run: |
          curl --fail --location --silent --show-error \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.17.27.zip -o "$RUNNER_TEMP/awscliv2.zip"
          echo "0b03b4b6ce1358537ce11a021c46bcda90f9532b1ab7d264e108a8fbcac948f2  $RUNNER_TEMP/awscliv2.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP/awscli-installer"
          "$RUNNER_TEMP/awscli-installer/aws/install" --install-dir "$RUNNER_TEMP/aws-cli" --bin-dir "$RUNNER_TEMP/aws-bin"
          echo "$RUNNER_TEMP/aws-bin" >> "$GITHUB_PATH"
          python -m pip install --require-hashes --only-binary=:all: -r tests/golden/requirements.txt
          npm ci --prefix tests/golden --ignore-scripts --no-audit --no-fund
      - name: Compilar daemon y bootstrap de prueba
        run: cargo build --locked -p zapcloud -p zc-api-lambda --bin zapcloud --bin api_test_bootstrap
      - name: Matriz local con SigV4 (sin cuenta AWS)
        run: |
          python -m unittest discover -s tests/golden -p 'test_*.py'
          python tests/golden/run.py
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: golden-local
          path: tests/golden/results/local.json
          if-no-files-found: error
      - name: Declarar alcance
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Golden compatibility — base local
          AWS CLI, SDK JS v3 y Boto3 ejecutan los mismos casos contra un daemon con SigV4.
          Versiones, resultados y procedencia están en el artefacto `golden-local`.
          **Referencia AWS no capturada:** este job verifica el contrato documentado,
          no acredita paridad AWS ni cierra el gate de v0.1.2. Ver `tests/golden/README.md`.
          EOF
